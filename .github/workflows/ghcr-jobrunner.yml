name: Build JobRunner Container

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/mentaldesk/truman-sentry-jobrunner

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # MinVer derives the version from tags, and set-commits works out the commit
          # range since the last release. Both need real history, not a shallow clone.
          fetch-depth: 0

      # Computed here rather than in the container build, which has no .git: the build
      # context is ./src and .git is both outside it and in .dockerignore.
      - name: Compute version
        id: version
        run: |
          dotnet tool install --global minver-cli --version 6.0.0
          echo "version=$(minver -t v)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Deliberately build-only. This is the companion repo for the blog series: it exists
      # to be read, not deployed, so nothing is published and no registry credentials are
      # needed. The build still runs so a reader copying the Dockerfile knows it works.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./src
          file: ./src/Truman.JobRunner/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Read inside the Dockerfile via --mount=type=secret, so it never lands in a
          # layer or in the image history. Empty on fork PRs, where GitHub withholds
          # secrets; the Sentry upload is skipped and the build still succeeds.
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
